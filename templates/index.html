<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Opportunities Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 28px;
            font-weight: bold;
        }

        .controls {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .last-updated {
            color: #666;
            font-size: 14px;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .opportunities {
            display: grid;
            gap: 15px;
        }

        .opportunity-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .opportunity-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            flex: 1;
            margin-right: 20px;
        }

        .profit-badge {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
        }

        .strategy {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .market-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .market {
            background: #f9fafb;
            padding: 15px;
            border-radius: 5px;
        }

        .market-source {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .market-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .market-label {
            color: #666;
        }

        .market-value {
            color: #333;
            font-weight: 600;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .detail-item {
            font-size: 14px;
        }

        .detail-label {
            color: #666;
            margin-right: 5px;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .no-opportunities {
            background: white;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .no-opportunities h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .no-opportunities p {
            color: #666;
        }

        .error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Arbitrage Opportunities Dashboard</h1>
            <p class="subtitle">Real-time arbitrage detection between Polymarket and Kalshi</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Polymarket Markets</div>
                <div class="stat-value" id="polymarket-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Kalshi Markets</div>
                <div class="stat-value" id="kalshi-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Matched Markets</div>
                <div class="stat-value" id="matched-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Arbitrage Opportunities</div>
                <div class="stat-value" id="opportunities-count">-</div>
            </div>
        </div>

        <div class="controls">
            <div class="last-updated">
                Last updated: <span id="last-updated">Never</span>
            </div>
            <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
                🔄 Refresh Data
            </button>
        </div>

        <div id="error-container"></div>

        <div class="opportunities" id="opportunities">
            <div class="loading">Loading opportunities...</div>
        </div>
    </div>

    <script>
        let isRefreshing = false;

        async function loadOpportunities() {
            try {
                const response = await fetch('/api/opportunities');
                const data = await response.json();
                
                updateStats(data.stats);
                updateLastUpdated(data.last_updated);
                displayOpportunities(data.opportunities);
                clearError();
            } catch (error) {
                console.error('Error loading opportunities:', error);
                showError('Failed to load opportunities. Please try again.');
            }
        }

        async function refreshData() {
            if (isRefreshing) return;
            
            isRefreshing = true;
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.textContent = '🔄 Refreshing...';
            
            try {
                const response = await fetch('/api/refresh');
                const data = await response.json();
                
                if (data.success) {
                    await loadOpportunities();
                } else {
                    showError('Failed to refresh data.');
                }
            } catch (error) {
                console.error('Error refreshing data:', error);
                showError('Failed to refresh data. Please try again.');
            } finally {
                isRefreshing = false;
                btn.disabled = false;
                btn.textContent = '🔄 Refresh Data';
            }
        }

        function updateStats(stats) {
            document.getElementById('polymarket-count').textContent = stats.polymarket_markets;
            document.getElementById('kalshi-count').textContent = stats.kalshi_markets;
            document.getElementById('matched-count').textContent = stats.matched_markets;
            document.getElementById('opportunities-count').textContent = stats.arbitrage_opportunities;
        }

        function updateLastUpdated(timestamp) {
            if (timestamp) {
                const date = new Date(timestamp);
                document.getElementById('last-updated').textContent = date.toLocaleString();
            }
        }

        function displayOpportunities(opportunities) {
            const container = document.getElementById('opportunities');
            
            if (opportunities.length === 0) {
                container.innerHTML = `
                    <div class="no-opportunities">
                        <h2>No Arbitrage Opportunities Found</h2>
                        <p>Currently, there are no profitable arbitrage opportunities between Polymarket and Kalshi.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = opportunities.map(opp => `
                <div class="opportunity-card">
                    <div class="opportunity-header">
                        <div class="question">${opp.question}</div>
                        <div class="profit-badge">+${(opp.profit_percentage * 100).toFixed(2)}%</div>
                    </div>
                    
                    <div class="strategy">${opp.strategy}</div>
                    
                    <div class="market-details">
                        <div class="market">
                            <div class="market-source">${opp.market1.source}</div>
                            <div class="market-info">
                                <span class="market-label">Market ID:</span>
                                <span class="market-value">${opp.market1.market_id}</span>
                            </div>
                            <div class="market-info">
                                <span class="market-label">Yes Price:</span>
                                <span class="market-value">$${opp.market1.yes_price.toFixed(4)}</span>
                            </div>
                            <div class="market-info">
                                <span class="market-label">No Price:</span>
                                <span class="market-value">$${opp.market1.no_price.toFixed(4)}</span>
                            </div>
                        </div>
                        
                        <div class="market">
                            <div class="market-source">${opp.market2.source}</div>
                            <div class="market-info">
                                <span class="market-label">Market ID:</span>
                                <span class="market-value">${opp.market2.market_id}</span>
                            </div>
                            <div class="market-info">
                                <span class="market-label">Yes Price:</span>
                                <span class="market-value">$${opp.market2.yes_price.toFixed(4)}</span>
                            </div>
                            <div class="market-info">
                                <span class="market-label">No Price:</span>
                                <span class="market-value">$${opp.market2.no_price.toFixed(4)}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="details-row">
                        <div class="detail-item">
                            <span class="detail-label">Total Cost:</span>
                            <span class="detail-value">$${opp.total_cost.toFixed(4)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Potential Profit:</span>
                            <span class="detail-value">$${opp.potential_profit.toFixed(4)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Similarity Score:</span>
                            <span class="detail-value">${(opp.similarity_score * 100).toFixed(1)}%</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }

        // Load opportunities on page load
        loadOpportunities();

        // Auto-refresh every 5 minutes
        setInterval(loadOpportunities, 5 * 60 * 1000);
    </script>
</body>
</html>
